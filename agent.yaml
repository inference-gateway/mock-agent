---
apiVersion: adl.inference-gateway.com/v1
kind: Agent
metadata:
  name: mock-agent
  description: A2A agent server for mocking and testing. Uses a mock LLM client - no API keys required!
  version: 0.1.11
spec:
  capabilities:
    streaming: true
    pushNotifications: false
    stateTransitionHistory: false
  artifacts:
    enabled: true
  agent:
    provider: ""
    model: ""
    systemPrompt: |
      You are a mock AI assistant designed for testing and development purposes.

      You have access to several mock tools that demonstrate different testing scenarios:
      - echo: Simply echo back the input message (useful for basic connectivity tests)
      - delay: Simulate slow responses with configurable delays
      - error: Simulate error conditions for testing error handling
      - random_data: Generate random test data
      - validate: Validate input against common patterns

      When responding:
      - Be clear and predictable in your responses
      - Include relevant metadata about the request
      - Support both streaming and non-streaming modes
      - Handle edge cases gracefully

      Your purpose is to provide consistent, reproducible responses for testing A2A protocol implementations.
  config:
    tools:
      read:
        enabled: true
        max_lines: 2000
  tools:
    - id: read
    - id: echo
      name: echo
      description: Echo back the input message (useful for basic connectivity tests)
      tags:
        - mock
        - testing
        - echo
      schema:
        type: object
        properties:
          message:
            type: string
            description: The message to echo back
        required:
          - message
    - id: delay
      name: delay
      description: Simulate slow responses with configurable delays
      tags:
        - mock
        - testing
        - performance
      schema:
        type: object
        properties:
          duration_seconds:
            type: number
            description: Number of seconds to delay (default 2)
          message:
            type: string
            description: Message to return after delay
    - id: error
      name: error
      description: Simulate error conditions for testing error handling
      tags:
        - mock
        - testing
        - error-handling
      schema:
        type: object
        properties:
          error_type:
            type: string
            description: Type of error to simulate
            enum:
              - validation
              - timeout
              - internal
              - not_found
          message:
            type: string
            description: Custom error message
        required:
          - error_type
    - id: random_data
      name: random_data
      description: Generate random test data
      tags:
        - mock
        - testing
        - data-generation
      schema:
        type: object
        properties:
          data_type:
            type: string
            description: Type of data to generate
            enum:
              - uuid
              - email
              - name
              - number
              - json
          count:
            type: number
            description: Number of items to generate (default 1)
        required:
          - data_type
    - id: validate
      name: validate
      description: Validate input against common patterns
      tags:
        - mock
        - testing
        - validation
      schema:
        type: object
        properties:
          input:
            type: string
            description: The input to validate
          validation_type:
            type: string
            description: Type of validation
            enum:
              - email
              - url
              - json
              - uuid
              - phone
        required:
          - input
          - validation_type
  skills:
    - id: connectivity-check
      bare: true
      name: connectivity-check
      description: "Use this when the user wants to verify the agent is reachable and responding correctly. Invokes the echo tool with a known payload and confirms the round-trip succeeded."
      tags:
        - mock
        - testing
        - connectivity
    - id: error-injection
      bare: true
      name: error-injection
      description: "Use this when the user wants to test how their client handles different failure modes. Invokes the error tool across the supported error_type values (validation, timeout, internal, not_found) so the caller can observe each error path."
      tags:
        - mock
        - testing
        - error-handling
    - id: load-simulation
      bare: true
      name: load-simulation
      description: "Use this when the user wants to test client behavior under slow responses with realistic payloads. Combines the delay tool (to introduce latency) with the random_data tool (to produce a test payload of the requested shape)."
      tags:
        - mock
        - testing
        - performance
  server:
    port: 8080
    scheme: http
    debug: false
  language:
    go:
      module: github.com/inference-gateway/mock-agent
      version: "1.26.4"
      vendor:
        deps: []
        devdeps: []
  scm:
    provider: github
    url: https://github.com/inference-gateway/mock-agent
    github_app: true
    issue_templates: false
    dependabot: true
    ci: true
    cd: true
  development:
    sandbox:
      flox:
        enabled: true
      devcontainer:
        enabled: false
      dockerCompose:
        enabled: true
    ai:
      orchestrators:
        claudecode:
          enabled: true
        codex:
          enabled: false
        gemini:
          enabled: false
        opencode:
          enabled: false
        infer:
          enabled: true
    deps: []
