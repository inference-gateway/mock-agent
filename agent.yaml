---
apiVersion: adl.inference-gateway.com/v1
kind: Agent
metadata:
  name: mock-agent
  description:
    A2A agent server for mocking and testing. Uses a mock LLM client - no API
    keys required!
  version: 0.4.2
spec:
  capabilities:
    streaming: true
    pushNotifications: false
    stateTransitionHistory: false
  artifacts:
    enabled: true
  telemetry:
    enabled: true
    traces:
      exporter:
        otlp:
          endpoint: http://localhost:4318
          protocol: http/protobuf
    metrics:
      exporter:
        prometheus:
          host: ""
          port: 9090
  agent:
    provider: ""
    model: ""
    systemPrompt: |
      You are a mock AI assistant designed for testing and development purposes.

      You have access to several mock tools that demonstrate different testing scenarios:
      - echo: Simply echo back the input message (useful for basic connectivity tests)
      - delay: Simulate slow responses with configurable delays
      - error: Simulate error conditions for testing error handling
      - random_data: Generate random test data
      - validate: Validate input against common patterns
      - Read: Read a file from disk - the mock routes here when a request mentions
        "read <path>", exercising a real tool call (and its telemetry span) so
        distributed traces show a nested sub-tool span under a2a.request
      - simulate_tool_call: Simulate one tool call with a configurable name, latency
        and optional error status. The mock drives it repeatedly to build multi
        tool-call workloads for load, latency and failure testing.

      The mock routes on deterministic keywords, not model reasoning. Notably,
      "read <path>" runs the Read tool against <path> (defaulting to README.md),
      which is handy for end-to-end distributed-tracing demos. Saying
      "simulate N tool calls" (or setting MOCK_TOOL_CALLS=read,search,read) drives a
      sequence of instrumented simulate_tool_call spans - each with its own
      gen_ai.tool.name, duration and optional injected failure - so a task can look
      like a realistic multi-step agent in a trace.

      When responding:
      - Be clear and predictable in your responses
      - Include relevant metadata about the request
      - Support both streaming and non-streaming modes
      - Handle edge cases gracefully

      Your purpose is to provide consistent, reproducible responses for testing A2A protocol implementations.
    mcp:
      enabled: false
      servers: []
  config:
    tools:
      read:
        enabled: true
        max_lines: 2000
  tools:
    - id: read
    - id: echo
      name: echo
      description:
        Echo back the input message (useful for basic connectivity tests)
      tags:
        - mock
        - testing
        - echo
      schema:
        type: object
        properties:
          message:
            type: string
            description: The message to echo back
        required:
          - message
    - id: delay
      name: delay
      description: Simulate slow responses with configurable delays
      tags:
        - mock
        - testing
        - performance
      schema:
        type: object
        properties:
          duration_seconds:
            type: number
            description: Number of seconds to delay (default 2)
          message:
            type: string
            description: Message to return after delay
    - id: error
      name: error
      description: Simulate error conditions for testing error handling
      tags:
        - mock
        - testing
        - error-handling
      schema:
        type: object
        properties:
          error_type:
            type: string
            description: Type of error to simulate
            enum:
              - validation
              - timeout
              - internal
              - not_found
          message:
            type: string
            description: Custom error message
        required:
          - error_type
    - id: random_data
      name: random_data
      description: Generate random test data
      tags:
        - mock
        - testing
        - data-generation
      schema:
        type: object
        properties:
          data_type:
            type: string
            description: Type of data to generate
            enum:
              - uuid
              - email
              - name
              - number
              - json
          count:
            type: number
            description: Number of items to generate (default 1)
        required:
          - data_type
    - id: validate
      name: validate
      description: Validate input against common patterns
      tags:
        - mock
        - testing
        - validation
      schema:
        type: object
        properties:
          input:
            type: string
            description: The input to validate
          validation_type:
            type: string
            description: Type of validation
            enum:
              - email
              - url
              - json
              - uuid
              - phone
        required:
          - input
          - validation_type
    - id: simulate_tool_call
      name: simulate_tool_call
      description:
        Simulate a single tool call for load, latency and failure testing. Emits
        an instrumented span (gen_ai.tool.name) with a configurable duration and
        optional error status. The mock LLM drives this once per entry of a
        multi-tool-call workload.
      tags:
        - mock
        - testing
        - performance
        - tracing
      schema:
        type: object
        properties:
          name:
            type: string
            description:
              Tool name reported as gen_ai.tool.name and the span suffix
              (tool.<name>), e.g. read or search.
          duration_ms:
            type: number
            description:
              Simulated latency in milliseconds (default 100, capped at 60000).
          fail:
            type: boolean
            description:
              "When true, mark the emitted span with error status. This is
              non-fatal: the surrounding workload continues so the full trace is
              produced."
  skills:
    - id: connectivity-check
      bare: true
      name: connectivity-check
      description:
        "Use this when the user wants to verify the agent is reachable and
        responding correctly. Invokes the echo tool with a known payload and
        confirms the round-trip succeeded."
      tags:
        - mock
        - testing
        - connectivity
    - id: error-injection
      bare: true
      name: error-injection
      description:
        "Use this when the user wants to test how their client handles different
        failure modes. Invokes the error tool across the supported error_type
        values (validation, timeout, internal, not_found) so the caller can
        observe each error path."
      tags:
        - mock
        - testing
        - error-handling
    - id: load-simulation
      bare: true
      name: load-simulation
      description:
        "Use this when the user wants to test client behavior under slow
        responses with realistic payloads. Combines the delay tool (to introduce
        latency) with the random_data tool (to produce a test payload of the
        requested shape)."
      tags:
        - mock
        - testing
        - performance
  server:
    port: 8080
    scheme: http
    debug: false
  language:
    go:
      module: github.com/inference-gateway/mock-agent
      version: "1.26.4"
      vendor:
        deps:
          - github.com/inference-gateway/sdk@v1.26.1
        devdeps: []
  hooks:
    post:
      - go mod tidy
  scm:
    provider: github
    url: https://github.com/inference-gateway/mock-agent
    github_app: true
    issue_templates: false
    dependabot: true
    ci: true
    cd: true
    app_id_secret: RELEASER_APP_CLIENT_ID
    app_private_key_secret: RELEASER_APP_PRIVATE_KEY
  development:
    sandbox:
      flox:
        enabled: true
      devcontainer:
        enabled: false
      dockerCompose:
        enabled: true
    ai:
      orchestrators:
        claudecode:
          enabled: true
          appIdSecret: CLAUDE_APP_ID
          appPrivateKeySecret: CLAUDE_APP_PRIVATE_KEY
        codex:
          enabled: false
        gemini:
          enabled: false
        opencode:
          enabled: false
        infer:
          enabled: true
          appIdSecret: INFER_APP_ID
          appPrivateKeySecret: INFER_APP_PRIVATE_KEY
    deps: []
  examples:
    - title: Connectivity smoke test
      description: >-
        Send a known payload through the echo tool (the connectivity-check
        skill) and confirm the round-trip, verifying the agent is reachable and
        responding over A2A.
    - title: Error-handling drill
      description: >-
        Drive the error tool across every error_type - validation, timeout,
        internal, not_found - via the error-injection skill to see how your
        client reacts to each failure mode.
    - title: Latency and load simulation
      description: >-
        Combine the delay tool with random_data (the load-simulation skill) to
        return realistic test payloads after a configurable delay, exercising
        client timeouts and streaming under slow responses.
    - title: Distributed-tracing demo with nested tool spans
      description: >-
        Send "read <path>" to route through the Read built-in and emit a
        tool.read span nested under a2a.request, producing real per-tool
        sub-spans for end-to-end OpenTelemetry tracing (see
        examples/opentelemetry).
  documentation:
    pages:
      - title: Getting Started
        path: docs/getting-started.md
        description:
          Install, build, and run the mock agent locally or with Docker.
      - title: Configuration
        path: docs/configuration.md
        description:
          Environment variables and agent.yaml settings that control the mock
          agent.
      - title: Usage
        path: docs/usage.md
        description:
          Drive the mock tools and skills over A2A, including the deterministic
          keyword routing.
      - title: Simulating Tool Calls
        path: docs/simulating-tool-calls.md
        description:
          Drive configurable multi-tool-call workloads - counts, per-call
          latency, and failure injection - via prompt keywords or the
          MOCK_TOOL_CALLS env.
